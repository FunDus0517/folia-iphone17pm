name: 苹果未签名安装包

on:
  workflow_dispatch:
    inputs:
      backend_origin:
        description: '可选：已部署的 Folia 服务端 HTTPS 域名，不含 /api 路径'
        required: false
        type: string
      netease_api_base:
        description: '可选：网易云接口 HTTPS 地址，或上述域名下的 /api 路径'
        required: false
        type: string
      kugou_api_base:
        description: '可选：酷狗接口 HTTPS 地址，或上述域名下的 /api 路径'
        required: false
        type: string
      qq_api_base:
        description: '可选：QQ 音乐接口 HTTPS 地址，或上述域名下的 /api/qq'
        required: false
        type: string
      publish_release:
        description: '将未签名安装包与校验文件发布到仓库下载页'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'ios-*'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VITE_FOLIA_API_BASE: ${{ inputs.backend_origin || vars.VITE_FOLIA_API_BASE }}
      VITE_NETEASE_API_BASE: ${{ inputs.netease_api_base || vars.VITE_NETEASE_API_BASE }}
      VITE_KUGOU_API_BASE: ${{ inputs.kugou_api_base || vars.VITE_KUGOU_API_BASE }}
      VITE_QQ_API_BASE: ${{ inputs.qq_api_base || vars.VITE_QQ_API_BASE }}
      VITE_NATIVE_IOS: 'true'
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置构建运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packaging/ios/package-lock.json

      - name: 检查苹果编译工具
        run: |
          xcodebuild -version
          version="$(xcodebuild -version | awk '/Xcode/ { print $2 }')"
          if [ "${version%%.*}" -lt 26 ]; then
            echo '::error::原生工具链要求 Xcode 26 或更新版本。'
            exit 1
          fi

      - name: 安装网页依赖并跳过桌面程序下载
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 安装独立的苹果打包工具
        run: npm --prefix packaging/ios ci --no-audit --no-fund

      - name: 测试打包参数校验
        run: npm --prefix packaging/ios test

      - name: 检查应用代码类型
        run: npm run typecheck

      - name: 运行完整单元回归与音乐接口检查
        env:
          VITE_NATIVE_IOS: 'false'
        run: npm run test:unit -- --maxWorkers=4

      - name: 安装手机布局测试浏览器
        run: npx playwright install webkit

      - name: 测试中文界面、竖横屏与触控按键
        run: npx playwright test -c playwright.mobile.config.ts

      - name: 保存手机布局截图与问题记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone17PM-layout-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: test-results/

      - name: 编译内嵌网页资源
        run: npm --prefix packaging/ios run build:web

      - name: 生成并同步苹果原生工程
        run: npm --prefix packaging/ios run prepare:ios

      - name: 编译真机安装包并校验未签名状态
        id: ipa
        run: npm --prefix packaging/ios run build:unsigned

      - name: 保存安装包、校验值与构建记录
        uses: actions/upload-artifact@v4
        with:
          name: Folia-iPhone17PM-unsigned-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            packaging/ios/output/*.ipa
            packaging/ios/output/*.sha256
            packaging/ios/output/BUILD-INFO.json

      - name: 发布仓库下载页
        if: startsWith(github.ref, 'refs/tags/ios-') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            tag="$TAG_NAME"
          else
            tag="ios-build-${BUILD_NUMBER}"
          fi
          cat > "$RUNNER_TEMP/ios-release-notes.md" <<'NOTES'
          ## Folia 苹果 17 大屏版

          本次提供从对应源码提交编译的 **真机未签名安装包**。
          安装前需要自行签名。

          - 应用全局使用简体中文；包含安全区、竖横屏、触控按键与浮层遮挡修复。
          - 修复手机登录窗口偏移、错误态持续转圈；未配置音源可直接进入音乐服务设置。
          - 三平台接口可在手机设置中填写并检查连接，修改后隔离旧登录信息，无需重新编译。
          - 网页资源在包内本地加载，未替换成远程网页。
          - 当前未配置音乐服务端，可体验界面与内置歌词动画预览；在线搜索播放需补充接口。
          - 手机本地音频导入尚未移植；本包不包含可试听歌曲。
          - 在线登录、播放及账号操作需要自己的接口；后台与锁屏连续播放尚未通过真机验收。
          - 手机功能检查矩阵见源码中的 `docs/IOS-FUNCTION-CHECK.md`，不以模拟测试代替实机结果。
          - 服务配置与校验值见构建记录附件。
          - 构建及签名说明见源码中的 `docs/IOS-BUILD.md`。
          NOTES
          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPOSITORY" --target "$SOURCE_SHA" \
              --title "Folia 苹果17大屏版（未签名）— 第${BUILD_NUMBER}次构建" \
              --prerelease --notes-file "$RUNNER_TEMP/ios-release-notes.md"
          fi
          gh release upload "$tag" packaging/ios/output/*.ipa \
            packaging/ios/output/*.sha256 packaging/ios/output/BUILD-INFO.json \
            --repo "$REPOSITORY" --clobber

      - name: 汇总本次实际构建结果
        if: success()
        env:
          IPA_NAME: ${{ steps.ipa.outputs.ipa_name }}
        run: |
          {
            echo '## 苹果未签名安装包'
            echo "- 文件： \`${IPA_NAME}\`"
            echo '- 架构：苹果真机 arm64'
            echo '- 签名：尚未签名，安装前需要自行签名'
            if [ -n "$VITE_FOLIA_API_BASE" ]; then
              echo '- 音乐服务端：已配置，详见构建记录'
            else
              echo '- 音乐服务端：未配置，在线音乐功能需补充接口'
            fi
            echo '- 安装包完整性、应用信息、真机架构和未签名状态校验已通过'
          } >> "$GITHUB_STEP_SUMMARY"
