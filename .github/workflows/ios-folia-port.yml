# Generated by packaging/ios/write-workflow.py; edit its template or archive verifier, then regenerate.
name: 原版 Folia 手机移植 IPA（手动验证）

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: '当前仓库根目录或 folia-port-input/ 内的完整 Folia-major 源码 ZIP 路径'
        required: true
        type: string
      source_sha256:
        description: '上述完整源码 ZIP 的 SHA-256（64位小写十六进制）'
        required: true
        type: string
      source_parts_manifest:
        description: '可选：大源码 ZIP 的分片清单 *.parts.json 路径；留空时直接使用 ZIP'
        required: false
        type: string
      backend_origin:
        description: '可选：已部署的 Folia 服务端 HTTPS 站点，不含 /api'
        required: false
        type: string
      netease_api_base:
        description: '可选：网易云 HTTPS 接口地址'
        required: false
        type: string
      qq_api_base:
        description: '可选：QQ 音乐 HTTPS 接口地址'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: folia-original-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-ios-port:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CAPACITOR_DISABLE_TELEMETRY: 'true'
      VITE_FOLIA_API_BASE: ${{ inputs.backend_origin }}
      VITE_NETEASE_API_BASE: ${{ inputs.netease_api_base }}
      VITE_QQ_API_BASE: ${{ inputs.qq_api_base }}
      VITE_NATIVE_IOS: 'true'
      IOS_NATIVE_REBUILT: 'true'
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 只读获取发布输入提交
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 验证完整源码 ZIP 并安全解包
        env:
          SOURCE_ARCHIVE: ${{ inputs.source_archive }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          SOURCE_PARTS_MANIFEST: ${{ inputs.source_parts_manifest }}
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ARCHIVE" "$SOURCE_SHA256" "$RUNNER_TEMP/folia-original-source" "$SOURCE_PARTS_MANIFEST" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import sys
          import zipfile

          # packaging/ios/verify-source-archive.py：完整源码归档的路径、摘要与原项目身份校验。
          def strict_json(text):
              def unique_pairs(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(f'JSON 字段重复：{key}')
                      result[key] = value
                  return result
              return json.loads(text, object_pairs_hook=unique_pairs)


          def assemble_parts(archive, expected_sha256, manifest_path):
              archive, manifest_path = Path(archive), Path(manifest_path)
              if not re.fullmatch(r'[a-f0-9]{64}', expected_sha256):
                  raise ValueError('源码 SHA-256 必须为64位小写十六进制')
              if manifest_path.is_symlink() or not manifest_path.is_file() or manifest_path.stat().st_size > 65536:
                  raise ValueError('分片清单必须为不超过64KiB的普通 JSON 文件')
              if manifest_path.resolve().parent != archive.resolve().parent:
                  raise ValueError('分片清单与目标归档必须在同一目录')
              manifest = strict_json(manifest_path.read_text(encoding='utf-8'))
              if not isinstance(manifest, dict) or set(manifest) != {'version', 'archive', 'sha256', 'parts'}:
                  raise ValueError('分片清单字段无效')
              if type(manifest['version']) is not int or manifest['version'] != 1:
                  raise ValueError('分片清单版本必须为1')
              if manifest['archive'] != archive.name or manifest['sha256'] != expected_sha256:
                  raise ValueError('分片清单的归档名称或总摘要与输入不一致')
              parts = manifest['parts']
              if not isinstance(parts, list) or not 1 <= len(parts) <= 16:
                  raise ValueError('源码分片数量必须为1至16片')
              total, resolved_parts = 0, []
              for index, part in enumerate(parts, start=1):
                  if not isinstance(part, dict) or set(part) != {'name', 'sha256', 'bytes'}:
                      raise ValueError('分片字段无效')
                  name, digest, size = part['name'], part['sha256'], part['bytes']
                  if (not isinstance(name, str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*\.zip\.part\d{2}', name)
                          or name != f'{archive.name}.part{index:02d}'):
                      raise ValueError('分片必须是按序编号、无路径的目标 ZIP 文件名')
                  if not isinstance(digest, str) or not re.fullmatch(r'[a-f0-9]{64}', digest):
                      raise ValueError('分片 SHA-256 无效')
                  if type(size) is not int or not 1 <= size <= 20 * 1024 * 1024:
                      raise ValueError('每片大小必须为1字节至20MiB')
                  total += size
                  if total > 200 * 1024 * 1024:
                      raise ValueError('源码分片总大小超过200MiB')
                  filename = manifest_path.parent / name
                  resolved_parts.append((filename, digest, size))
              for filename, _, size in resolved_parts:
                  if filename.is_symlink() or not filename.is_file() or filename.stat().st_size != size:
                      raise ValueError(f'分片缺失、不是普通文件或字节数不符：{filename.name}')
              if archive.exists() or archive.is_symlink():
                  raise ValueError('分片拼接目标 ZIP 已存在，拒绝覆盖')
              temporary = archive.with_name(archive.name + '.assembling')
              full_hash = hashlib.sha256()
              temporary_created = False
              try:
                  with temporary.open('xb') as output:
                      temporary_created = True
                      for filename, digest, size in resolved_parts:
                          content = filename.read_bytes()
                          if len(content) != size or hashlib.sha256(content).hexdigest() != digest:
                              raise ValueError(f'分片 SHA-256 不匹配：{filename.name}')
                          output.write(content)
                          full_hash.update(content)
                  if full_hash.hexdigest() != expected_sha256:
                      raise ValueError('拼接后的完整源码 ZIP SHA-256 不匹配')
                  temporary.replace(archive)
              finally:
                  if temporary_created and temporary.exists():
                      temporary.unlink()
              print(f'SOURCE_PARTS_ASSEMBLED_OK: {len(parts)} 片；{total} 字节；{expected_sha256}')
              return archive


          def verify_extract(archive, expected_sha256, destination):
              archive, destination = Path(archive), Path(destination)
              if not re.fullmatch(r'[a-f0-9]{64}', expected_sha256):
                  raise ValueError('源码 SHA-256 必须为64位小写十六进制')
              if archive.is_symlink() or not archive.is_file():
                  raise ValueError('源码归档必须为普通文件且不是符号链接')
              if archive.stat().st_size > 200 * 1024 * 1024:
                  raise ValueError('源码归档超过200MB限制')
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual != expected_sha256:
                  raise ValueError('完整源码归档 SHA-256 不匹配')
              with zipfile.ZipFile(archive) as source:
                  entries = source.infolist()
                  if not entries or len(entries) > 25000 or sum(item.file_size for item in entries) > 600 * 1024 * 1024:
                      raise ValueError('源码归档为空或超过解包数量/大小限制')
                  seen, roots = set(), set()
                  for item in entries:
                      key = item.orig_filename
                      parsed = PurePosixPath(key)
                      if ('\\' in key or key.startswith('/') or any(part in ('', '.', '..') for part in key.rstrip('/').split('/'))
                              or ':' in key or any(ord(character) < 32 or ord(character) == 127 for character in key)):
                          raise ValueError(f'不安全的源码归档路径：{key}')
                      if key.casefold().rstrip('/') in seen:
                          raise ValueError(f'源码归档路径重复：{key}')
                      seen.add(key.casefold().rstrip('/'))
                      roots.add(parsed.parts[0])
                      mode = item.external_attr >> 16
                      if stat.S_ISLNK(mode) or (stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR)):
                          raise ValueError(f'源码归档含链接或特殊文件：{key}')
                      if any(part in ('.git', 'node_modules') for part in parsed.parts):
                          raise ValueError(f'源码归档混入仓库元数据或依赖：{key}')
                  if len(roots) != 1:
                      raise ValueError('完整源码归档必须包含唯一外层目录')
                  if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', next(iter(roots))):
                      raise ValueError('源码归档外层目录名无效')
                  if destination.is_symlink():
                      raise ValueError('源码解包目标目录不是普通目录')
                  if destination.exists() and any(destination.iterdir()):
                      raise ValueError('源码解包目标目录必须为空')
                  destination.mkdir(parents=True, exist_ok=True)
                  source.extractall(destination)
              root = destination / next(iter(roots))
              package = json.loads((root / 'package.json').read_text(encoding='utf-8'))
              if package.get('name') != 'folia-major' or package.get('version') != '0.7.21':
                  raise ValueError('归档不是预期 Folia-major 0.7.21 源码')
              for filename in ('src/App.tsx', 'src/index.tsx', 'package-lock.json', 'vite.config.ts',
                               'packaging/ios/package-lock.json', 'packaging/ios/build-unsigned.mjs',
                               'playwright.ios-port.config.ts', 'playwright.ios-phone.config.ts'):
                  if not (root / filename).is_file():
                      raise ValueError(f'完整源码归档缺少：{filename}')
              identity = json.loads((root / 'SOURCE-IDENTITY.json').read_text(encoding='utf-8'))
              if identity.get('upstreamRepository') != 'https://github.com/chthollyphile/folia-major':
                  raise ValueError('上游源码仓库身份不符')
              if not re.fullmatch(r'[a-f0-9]{40}', identity.get('upstreamCommit', '')):
                  raise ValueError('上游源码提交身份无效')
              if not re.fullmatch(r'[a-f0-9]{40}', identity.get('localBaseCommit', '')):
                  raise ValueError('本地适配基线身份无效')
              return root.resolve(), identity, actual


          def validate_repository_input(value, workspace, *, manifest=False):
              pattern = (r'(?:folia-port-input/)?[A-Za-z0-9][A-Za-z0-9._-]*\.parts\.json' if manifest
                         else r'(?:folia-port-input/)?[A-Za-z0-9][A-Za-z0-9._-]*\.zip')
              if not re.fullmatch(pattern, value):
                  raise ValueError('源码输入仅接受当前仓库根目录或 folia-port-input/ 内的 ZIP/分片清单')
              workspace = Path(workspace).resolve()
              candidate = workspace / value
              # 词法路径合法不代表实际目录仍在 checkout 内；同时拒绝任何父级符号链接。
              if candidate.parent.is_symlink() or candidate.is_symlink() or not candidate.resolve().is_relative_to(workspace):
                  raise ValueError('源码输入包含符号链接或离开当前仓库')
              return candidate


          if __name__ == '__main__':
              parts_manifest = sys.argv[4] if len(sys.argv) > 4 else ''
              if os.environ.get('GITHUB_ACTIONS') == 'true':
                  validate_repository_input(sys.argv[1], Path.cwd())
                  if parts_manifest:
                      validate_repository_input(parts_manifest, Path.cwd(), manifest=True)
              if parts_manifest:
                  assemble_parts(sys.argv[1], sys.argv[2], parts_manifest)
              root, identity, digest = verify_extract(sys.argv[1], sys.argv[2], sys.argv[3])
              if os.environ.get('GITHUB_ENV'):
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as target:
                      for key, value in {'FOLIA_PORT_ROOT': str(root), 'FOLIA_SOURCE_MODE': 'verified-source-archive',
                                         'FOLIA_SOURCE_ARCHIVE_SHA256': digest,
                                         'FOLIA_UPSTREAM_COMMIT': identity['upstreamCommit'],
                                         'FOLIA_SOURCE_BASE': identity['localBaseCommit']}.items():
                          target.write(f'{key}={value}\n')
              print(f'VERIFIED_SOURCE_ARCHIVE_OK: {digest}; folia-major 0.7.21; upstream={identity["upstreamCommit"]}')
          PY

      - name: 配置 Node 24 与 XcodeGen
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 检查苹果编译工具与模拟器
        run: |
          set -euo pipefail
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcrun simctl list devices available

      - name: 安装原项目与容器依赖（跳过桌面安装脚本）
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix packaging/ios ci --ignore-scripts --no-audit --no-fund

      - name: 校验打包逻辑与源码解包边界
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          mkdir -p packaging/ios/output
          npm --prefix packaging/ios test 2>&1 | tee packaging/ios/output/packaging-node.log
          python3 packaging/ios/verify-source-archive.test.py 2>&1 | tee packaging/ios/output/packaging-python.log

      - name: 原项目类型检查与完整单元回归（两个工作线程）
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          mkdir -p packaging/ios/output
          npm run typecheck 2>&1 | tee packaging/ios/output/typecheck.log
          VITE_NATIVE_IOS=false npm run test:unit -- --maxWorkers=2 2>&1 | tee packaging/ios/output/unit.log

      - name: 安装 WebKit 与 Chromium 测试浏览器
        working-directory: ${{ env.FOLIA_PORT_ROOT }}
        run: npx playwright install webkit chromium

      - name: 测试原版移动布局、中文、歌词与文件导入
        env:
          SOURCE_ARCHIVE_INPUT: ${{ inputs.source_archive }}
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          # Test-only real PCM duration covers the unchanged 180s test budget; no media clock/renderer mock.
          # The EXIT trap restores the exact helper bytes and all 3930 original source files before any build.
          fixture="test/ui/helpers/iosOriginalFixtures.ts"
          fixture_backup="$(mktemp "$RUNNER_TEMP/folia-original-fixture.XXXXXX")"
          fixture_guard="$RUNNER_TEMP/folia-original-fixture-guard.py"
          fixture_record="packaging/ios/output/BROWSER-TEST-FIXTURE-INFO.json"
          source_archive="$GITHUB_WORKSPACE/$SOURCE_ARCHIVE_INPUT"
          cat > "$fixture_guard" <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import sys
          import zipfile

          ORIGINAL_SHA = '4ac6d3c762d92584d605b448717147b81adaf47aab941c565d6c75ef915a47c2'
          EXTENDED_SHA = 'fb8bafef7e74f5ff7626924886154bd7ecac3a970a3dc454852309375afd1eb1'
          SOURCE_SHA = '22b310e6b35f34172e4daf495c82ad73f3837113a32c9a805c7c1a2596c581dd'
          TREE_SHA = '43b16ba89bfaa4256fdccd64a3e7b22e6e9310615d732d5bb780318c98610682'
          NEEDLE = b'export function originalAudioFixture(seconds = 90): Buffer {'
          REPLACEMENT = b'export function originalAudioFixture(seconds = 240): Buffer {'

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def verify_original_source(root, archive):
              assert sha(archive.read_bytes()) == SOURCE_SHA, 'Verified source ZIP03 bytes changed'
              entries = []
              with zipfile.ZipFile(archive) as source:
                  for item in source.infolist():
                      if item.is_dir():
                          continue
                      relative = PurePosixPath(item.filename).relative_to('folia-major-ios').as_posix()
                      content = source.read(item)
                      assert (root / relative).read_bytes() == content, f'Original source not restored: {relative}'
                      entries.append({'path': relative, 'sha256': sha(content), 'bytes': len(content)})
              entries.sort(key=lambda item: item['path'])
              digest = sha(json.dumps(entries, ensure_ascii=False, separators=(',', ':')).encode('utf-8'))
              assert len(entries) == 3930 and digest == TREE_SHA, 'Complete original source manifest changed'
              return {'verifiedOriginalSourceFiles': len(entries), 'originalSourceTreeSha256': digest}

          action, root_value, archive_value, backup_value, record_value, *exit_values = sys.argv[1:]
          root, archive, backup, record_path = map(Path, (root_value, archive_value, backup_value, record_value))
          fixture = root / 'test/ui/helpers/iosOriginalFixtures.ts'
          assert sha(backup.read_bytes()) == ORIGINAL_SHA, 'Original fixture backup changed'
          if action == 'apply':
              source = verify_original_source(root, archive)
              original = fixture.read_bytes()
              assert sha(original) == ORIGINAL_SHA and original.count(NEEDLE) == 1, 'Unexpected fixture source'
              extended = original.replace(NEEDLE, REPLACEMENT)
              assert sha(extended) == EXTENDED_SHA, 'Only the exact 90-to-240 fixture line may change'
              fixture.write_bytes(extended)
              assert sha(fixture.read_bytes()) == EXTENDED_SHA
              record = {
                  'status': 'real-pcm-fixture-applied; browser-result-pending',
                  'sourceArchiveSha256': SOURCE_SHA,
                  'testOnlyFile': 'test/ui/helpers/iosOriginalFixtures.ts',
                  'originalFixtureSha256': ORIGINAL_SHA,
                  'extendedFixtureSha256': EXTENDED_SHA,
                  'fixtureSeconds': {'original': 90, 'extended': 240},
                  'fixturePcm': {'sampleRate': 16000, 'channels': 1, 'bitsPerSample': 16,
                                 'originalBytes': 2880044, 'extendedBytes': 7680044},
                  'testTimeoutSeconds': 180,
                  'testCommand': 'npx playwright test -c playwright.ios-port.config.ts',
                  'unchangedAssertions': ['real media clock', 'six original lyric modes', 'real animated Pixi canvases',
                                          'pause by visible original button', 'paused media clock', 'seek to fourth lyric',
                                          'portrait and landscape safe areas'],
                  'productionSourceChanged': False,
                  'sourceRestoredBeforeBuild': False,
                  **source,
              }
              record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('REAL_PCM_FIXTURE_APPLIED: ' + json.dumps(record, ensure_ascii=False), flush=True)
          elif action == 'restore':
              assert len(exit_values) == 1
              assert fixture.read_bytes() == backup.read_bytes(), 'EXIT trap did not restore original bytes'
              assert sha(fixture.read_bytes()) == ORIGINAL_SHA
              source = verify_original_source(root, archive)
              record = json.loads(record_path.read_text(encoding='utf-8')) if record_path.exists() else {}
              code = int(exit_values[0])
              record.update({
                  'status': 'browser-command-succeeded' if code == 0 else 'browser-command-failed',
                  'browserExitStatus': code,
                  'sourceRestoredBeforeBuild': True,
                  'restoredFixtureSha256': sha(fixture.read_bytes()),
                  **source,
              })
              record_path.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('REAL_PCM_FIXTURE_RESTORED: ' + json.dumps(record, ensure_ascii=False), flush=True)
          else:
              raise ValueError('Unknown fixture action')
          PY
          printf '%s  %s\n' '4ac6d3c762d92584d605b448717147b81adaf47aab941c565d6c75ef915a47c2' "$fixture" | shasum -a256 -c -
          cp "$fixture" "$fixture_backup"
          restore_original_fixture() {
              local browser_status=$?
              trap - EXIT
              if ! cp "$fixture_backup" "$fixture"; then exit 98; fi
              if ! cmp "$fixture_backup" "$fixture"; then exit 98; fi
              if ! python3 "$fixture_guard" restore "$FOLIA_PORT_ROOT" "$source_archive" "$fixture_backup" "$fixture_record" "$browser_status"; then exit 98; fi
              printf '%s  %s\n' '4ac6d3c762d92584d605b448717147b81adaf47aab941c565d6c75ef915a47c2' "$fixture" | shasum -a256 -c - || exit 98
              exit "$browser_status"
          }
          trap restore_original_fixture EXIT
          python3 "$fixture_guard" apply "$FOLIA_PORT_ROOT" "$source_archive" "$fixture_backup" "$fixture_record"
          printf '%s  %s\n' 'fb8bafef7e74f5ff7626924886154bd7ecac3a970a3dc454852309375afd1eb1' "$fixture" | shasum -a256 -c -
          npx playwright test -c playwright.ios-port.config.ts 2>&1 | tee packaging/ios/output/playwright.log

      - name: 测试原版登录主机的手机短信交互（使用固定模拟服务）
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          npx playwright test --config playwright.ios-phone.config.ts 2>&1 | tee packaging/ios/output/playwright-phone.log

      - name: 构建原 Folia 前端并同步真正的原生容器
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          npm --prefix packaging/ios run build:web 2>&1 | tee packaging/ios/output/build-web.log
          npm --prefix packaging/ios run prepare:ios 2>&1 | tee packaging/ios/output/prepare-ios.log

      - name: 真正 WKWebView 设置开关与竖横屏冒烟
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          # External XCTest orchestration only; the verified production source ZIP03 stays unchanged.
          # XcodeGen resolves the spec's relative Swift source paths under --project UIRunner.
          external_harness="$GITHUB_WORKSPACE/.github/workflows/FoliaPortUITests.swift"
          external_harness_sha='9e1d9a7708deaaa51007fbdc7fb21424109296b531110f631a78f7ca20a0642e'
          printf '%s  %s\n' "$external_harness_sha" "$external_harness" | shasum -a256 -c -
          mkdir -p packaging/ios/output/UIRunner
          cp packaging/ios/UITests/HarnessApp.swift packaging/ios/output/UIRunner/HarnessApp.swift
          cp "$external_harness" packaging/ios/output/UIRunner/FoliaPortUITests.swift
          cmp packaging/ios/UITests/HarnessApp.swift packaging/ios/output/UIRunner/HarnessApp.swift
          cmp "$external_harness" packaging/ios/output/UIRunner/FoliaPortUITests.swift
          printf '%s  %s\n' "$external_harness_sha" packaging/ios/output/UIRunner/FoliaPortUITests.swift | shasum -a256 -c -
          npm --prefix packaging/ios run test:native 2>&1 | tee packaging/ios/output/native-ui.log
          # This file is created only after actual xcodebuild test success; record the exact tested harness.
          python3 - "$external_harness_sha" <<'PY'
          import json
          from pathlib import Path
          import sys
          filename = Path('packaging/ios/output/NATIVE-UI-INFO.json')
          record = json.loads(filename.read_text(encoding='utf-8'))
          record['externalTestHarness'] = {
              'repositoryPath': '.github/workflows/FoliaPortUITests.swift',
              'sha256': sys.argv[1],
              'startupStrategy': 'real-original-visible-buttons-only; no storage seeding or JS injection',
          }
          filename.write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: 真机 arm64 未签名归档与前端逐文件核验
        run: |
          set -euo pipefail
          cd "$FOLIA_PORT_ROOT"
          npm --prefix packaging/ios run build:unsigned 2>&1 | tee packaging/ios/output/archive.log

      - name: 保存手机测试截图与失败记录
        if: always() && env.FOLIA_PORT_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: FoliaOriginal-iPhone-tests-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ env.FOLIA_PORT_ROOT }}/test-results/
            ${{ env.FOLIA_PORT_ROOT }}/playwright-report/
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/*.log
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/*.xcresult/
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/NATIVE-UI-INFO.json
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/BROWSER-TEST-FIXTURE-INFO.json

      - name: 保存未签名 IPA 与来源核验记录（不发布）
        uses: actions/upload-artifact@v4
        with:
          name: FoliaOriginal-iPhone17PM-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/*.ipa
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/*.sha256
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/BUILD-INFO.json
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/WEB-RESOURCE-MANIFEST.json
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/NATIVE-UI-INFO.json
            ${{ env.FOLIA_PORT_ROOT }}/packaging/ios/output/BROWSER-TEST-FIXTURE-INFO.json
            ${{ env.FOLIA_PORT_ROOT }}/SOURCE-IDENTITY.json

      - name: 汇总本次实际验证
        if: success()
        run: |
          {
            echo '## 原版 Folia 手机移植'
            echo '- 原 Folia-major 0.7.21 前端与歌词渲染器打包进真实 Capacitor WKWebView。'
            echo '- 类型检查、原单元回归、手机浏览器测试与真实 WKWebView 冒烟通过。'
            echo '- iPhoneOS arm64 未签名归档；前端 JS/CSS 在 dist、容器与最终 IPA 中逐文件 SHA-256 相同。'
            echo '- 此流程只有仓库读取权限，没有发布、推送或上传发行版步骤。'
            echo '- 真实账号、实体手机、后台与长时间流畅度仍需用户设备验收。'
          } >> "$GITHUB_STEP_SUMMARY"
